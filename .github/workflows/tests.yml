name: Installer verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install test clients
        run: sudo apt-get update && sudo apt-get install -y shellcheck nginx mariadb-server php-cli restic
      - name: Regression tests
        run: bash tests/run.sh
  live-deployment:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, debian-12, debian-13]
        method: [standalone, docker]
        engine: [mariadb, mysql]
        exclude:
          - os: ubuntu-26.04
            method: standalone
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install VM tooling
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - name: Deploy on disposable systemd VM
        env:
          PTERO_GITHUB_TOKEN: ${{ github.token }}
        run: sudo --preserve-env=PTERO_GITHUB_TOKEN python3 scripts/vm_integration.py --os '${{ matrix.os }}' --method '${{ matrix.method }}' --engine '${{ matrix.engine }}'
      - name: Upload redacted results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deployment-${{ matrix.os }}-${{ matrix.method }}-${{ matrix.engine }}
          path: test-results/vm/*.json
