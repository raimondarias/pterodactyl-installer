name: Installer verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Operating system to validate (all runs the complete matrix)'
        type: choice
        default: all
        options: [all, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, debian-12, debian-13]
      target_method:
        description: 'Panel deployment method to validate'
        type: choice
        default: all
        options: [all, standalone, docker]
permissions:
  contents: read
jobs:
  regression:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install test clients
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y shellcheck nginx mariadb-server php-cli restic
      - name: Regression tests
        run: bash tests/run.sh
  live-deployment:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: ${{ fromJSON(inputs.target_os && inputs.target_os != 'all' && format('["{0}"]', inputs.target_os) || '["ubuntu-22.04","ubuntu-24.04","ubuntu-26.04","debian-12","debian-13"]') }}
        method: ${{ fromJSON(inputs.target_method && inputs.target_method != 'all' && format('["{0}"]', inputs.target_method) || '["standalone","docker"]') }}
        engine: [mariadb, mysql]
        exclude:
          - os: ubuntu-26.04
            method: standalone
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install VM tooling
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y qemu-system-x86 qemu-utils genisoimage
      - name: Deploy on disposable systemd VM
        env:
          PTERO_GITHUB_TOKEN: ${{ github.token }}
        run: sudo --preserve-env=PTERO_GITHUB_TOKEN python3 scripts/vm_integration.py --os '${{ matrix.os }}' --method '${{ matrix.method }}' --engine '${{ matrix.engine }}'
      - name: Upload redacted results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deployment-${{ matrix.os }}-${{ matrix.method }}-${{ matrix.engine }}
          path: test-results/vm/*.json
